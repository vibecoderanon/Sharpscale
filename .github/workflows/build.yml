name: Build & Release Sharpscale Suite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-switch:
    name: Build Sharpscale-NX (Switch)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitA64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up libtesla dependency
        run: |
          git clone --depth 1 https://github.com/WerWolv/libtesla.git /tmp/libtesla
          sed -i 's/this->m_scissoringStack.emplace(x, y, w, h);/this->m_scissoringStack.push({x, y, w, h});/' /tmp/libtesla/include/tesla.hpp
          mkdir -p /opt/devkitpro/libtesla/include
          cp -r /tmp/libtesla/include/* /opt/devkitpro/libtesla/include/

      - name: Compile Switch Plugin & Tesla Overlay
        run: |
          cd switch
          make clean
          make -j$(nproc)

      - name: Upload Switch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sharpscale-NX-Artifacts
          path: |
            switch/plugin/sharpscale.elf
            switch/overlay/ovl-sharpscale.ovl

  build-3ds:
    name: Build Sharpscale-3DS (3DS)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/tools/bin:/opt/devkitpro/devkitARM/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up 3gxtool
        run: |
          git clone --depth 1 https://gitlab.com/ThePixellizerOSS/3gxtool.git /tmp/3gxtool || true
          if [ -d /tmp/3gxtool ]; then
            cmake -B /tmp/3gxtool/build -S /tmp/3gxtool || true
            cmake --build /tmp/3gxtool/build -j$(nproc) || true
            if [ -f /tmp/3gxtool/build/3gxtool ]; then
              cp /tmp/3gxtool/build/3gxtool /opt/devkitpro/tools/bin/
            fi
          fi

      - name: Compile 3DS Targets (3GX & Config App)
        run: |
          cd 3ds
          make clean
          make -j$(nproc)

      - name: Upload 3DS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sharpscale-3DS-Artifacts
          path: |
            3ds/config_app/Sharpscale-3DS.3dsx
            3ds/plugin_3gx/sharpscale.3gx

  package-release:
    name: Package Suite & Publish GitHub Release
    needs: [build-switch, build-3ds]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Switch Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Sharpscale-NX-Artifacts
          path: dist/switch

      - name: Download 3DS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Sharpscale-3DS-Artifacts
          path: dist/3ds

      - name: Assemble SD Card Structure & Zip
        run: |
          mkdir -p release/switch/.overlays
          mkdir -p release/SaltySD/plugins
          mkdir -p release/3ds
          mkdir -p release/luma/plugins

          cp dist/switch/ovl-sharpscale.ovl release/switch/.overlays/
          cp dist/switch/sharpscale.elf release/SaltySD/plugins/
          cp dist/3ds/Sharpscale-3DS.3dsx release/3ds/
          cp dist/3ds/sharpscale.3gx release/luma/plugins/
          cp 3ds/firm_patcher/sharpscale_firm_patcher.py release/3ds/

          cd release && zip -r ../Sharpscale-MultiConsole-Suite.zip .
          cd ..
          mv Sharpscale-MultiConsole-Suite.zip release/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: Sharpscale Multi-Console Suite ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: |
            release/Sharpscale-MultiConsole-Suite.zip
            release/switch/.overlays/ovl-sharpscale.ovl
            release/SaltySD/plugins/sharpscale.elf
            release/3ds/Sharpscale-3DS.3dsx
            release/luma/plugins/sharpscale.3gx
            release/3ds/sharpscale_firm_patcher.py
          body: |
            ## Sharpscale Multi-Console Suite v1.0.0

            Official production build compiled directly from source using **devkitA64** and **devkitARM**.

            Hardware display plugins and utilities designed to eliminate blurry hardware scaling filters and deliver crisp, clean, and pixel-perfect video output across Nintendo Switch and Nintendo 3DS.

            ### Package Contents:
            - **`Sharpscale-MultiConsole-Suite.zip`**: All-in-one pre-packaged zip ready to extract to SD card root (`sdmc:/`).
            - **`ovl-sharpscale.ovl`**: Genuine Tesla Menu overlay (`sdmc:/switch/.overlays/`).
            - **`sharpscale.elf`**: Genuine SaltyNX VI/NVN hook plugin (`sdmc:/SaltySD/plugins/`).
            - **`Sharpscale-3DS.3dsx`**: Genuine Nintendo 3DS Homebrew Configurator (`sdmc:/3ds/`).
            - **`sharpscale.3gx`**: Genuine Luma3DS in-game 3GX plugin (`sdmc:/luma/plugins/`).
            - **`sharpscale_firm_patcher.py`**: Standalone PC/console FIRM scaling matrix patcher.

            ### SD Card Installation:
            1. Extract `Sharpscale-MultiConsole-Suite.zip` directly to the root of your SD card.
            2. For Switch: Open the Tesla Overlay with `L + D-Pad Down + R3` to configure scaling mode in real time.
            3. For 3DS: Enable game patching in Luma3DS configuration, then launch any title or use the Configurator app.
