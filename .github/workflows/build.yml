name: Build & Release Sharpscale Suite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Release Sharpscale Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Standalone Production Binaries & Suite Zip
        run: |
          python3 build_release.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sharpscale-MultiConsole-Suite
          path: |
            release/Sharpscale-MultiConsole-Suite.zip
            release/switch/.overlays/ovl-sharpscale.ovl
            release/SaltySD/plugins/sharpscale.elf
            release/3ds/Sharpscale-3DS.3dsx
            release/luma/plugins/sharpscale.3gx

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: Sharpscale Multi-Console Suite ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: |
            release/Sharpscale-MultiConsole-Suite.zip
            release/switch/.overlays/ovl-sharpscale.ovl
            release/SaltySD/plugins/sharpscale.elf
            release/3ds/Sharpscale-3DS.3dsx
            release/luma/plugins/sharpscale.3gx
          body: |
            ## Sharpscale Multi-Console Suite v1.0.0

            Hardware display plugins and utilities designed to eliminate blurry hardware scaling filters and deliver crisp, clean, and pixel-perfect video output across Nintendo Switch and Nintendo 3DS.

            ### Package Contents:
            - **`Sharpscale-MultiConsole-Suite.zip`**: All-in-one pre-packaged zip ready to extract to SD card root (`sdmc:/`).
            - **`ovl-sharpscale.ovl`**: Tesla Menu overlay for on-the-fly configuration (`sdmc:/switch/.overlays/`).
            - **`sharpscale.elf`**: SaltyNX VI/NVN hook plugin (`sdmc:/SaltySD/plugins/`).
            - **`Sharpscale-3DS.3dsx`**: Nintendo 3DS Homebrew Configurator (`sdmc:/3ds/`).
            - **`sharpscale.3gx`**: Luma3DS in-game 3GX plugin (`sdmc:/luma/plugins/`).

            ### SD Card Installation
            1. Extract `Sharpscale-MultiConsole-Suite.zip` directly to the root of your SD card.
            2. For Switch: Open the Tesla Overlay with `L + D-Pad Down + R3` to configure scaling mode in real time.
            3. For 3DS: Enable game patching in Luma3DS configuration, then launch any title or use the Configurator app.

